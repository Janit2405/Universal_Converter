<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Excel Converter</title>
    <script src="./xlsx.min.js"></script>
    <script src="./pako.min.js"></script>
    <script>
    // Fallback to CDN if local files don't load
    if (typeof XLSX === 'undefined') {
        document.write('<scr'+'ipt src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/scr'+'ipt>');
    }
    if (typeof pako === 'undefined') {
        document.write('<scr'+'ipt src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"><\/scr'+'ipt>');
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(59,130,246,0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(139,92,246,0.06) 0%, transparent 50%);
            animation: bgShift 15s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes bgShift {
            0% { transform: translate(0,0) rotate(0deg); }
            100% { transform: translate(-5%,-3%) rotate(3deg); }
        }

        .container { width: 100%; max-width: 560px; padding: 0 24px; }

        .header { text-align: center; margin-bottom: 40px; }

        .logo {
            font-size: 48px; margin-bottom: 16px;
            filter: drop-shadow(0 0 20px rgba(59,130,246,0.4));
        }

        h1 {
            font-size: 28px; font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 8px;
        }

        .subtitle { color: #6b7280; font-size: 14px; letter-spacing: 0.5px; }

        .drop-zone {
            border: 2px dashed rgba(59,130,246,0.3);
            border-radius: 16px; padding: 48px 24px;
            text-align: center; cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(10px);
            position: relative; overflow: hidden;
        }

        .drop-zone::before {
            content: ''; position: absolute; inset: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(59,130,246,0.05), rgba(139,92,246,0.05));
            opacity: 0; transition: opacity 0.3s ease;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: rgba(59,130,246,0.6);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(59,130,246,0.15);
        }

        .drop-zone:hover::before, .drop-zone.dragover::before { opacity: 1; }

        .drop-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.8; }
        .drop-text { font-size: 16px; font-weight: 500; margin-bottom: 8px; color: #d1d5db; }
        .drop-hint { font-size: 12px; color: #6b7280; }
        .file-input { display: none; }

        .formats {
            display: flex; flex-wrap: wrap; gap: 8px;
            justify-content: center; margin-top: 24px;
        }

        .format-tag {
            padding: 4px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
            background: rgba(59,130,246,0.1); color: #60a5fa;
            border: 1px solid rgba(59,130,246,0.2);
        }

        .format-tag.highmark {
            background: rgba(139,92,246,0.12); color: #a78bfa;
            border-color: rgba(139,92,246,0.25);
        }

        .status { margin-top: 24px; text-align: center; min-height: 60px; }
        .status.hidden { display: none; }

        .spinner {
            display: inline-block; width: 32px; height: 32px;
            border: 3px solid rgba(59,130,246,0.2);
            border-top-color: #3b82f6; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .status-text { font-size: 14px; color: #9ca3af; }

        .result {
            margin-top: 24px; padding: 20px; border-radius: 12px;
            background: rgba(16,185,129,0.08);
            border: 1px solid rgba(16,185,129,0.2);
            animation: fadeIn 0.4s ease;
        }

        .result.hidden { display: none; }

        .result.error {
            background: rgba(239,68,68,0.08);
            border-color: rgba(239,68,68,0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .result-icon { font-size: 20px; }
        .result-title { font-size: 14px; font-weight: 600; color: #10b981; }
        .result.error .result-title { color: #ef4444; }

        .result-stats { font-size: 13px; color: #9ca3af; line-height: 1.6; }
        .result-stats span { color: #d1d5db; font-weight: 500; }

        .download-btn {
            display: inline-flex; align-items: center; gap: 8px;
            margin-top: 16px; padding: 10px 24px; border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease;
            text-decoration: none;
        }

        .download-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(59,130,246,0.4);
        }

        .error-text { color: #f87171; font-size: 13px; }

        .footer {
            margin-top: 40px; text-align: center;
            font-size: 11px; color: #4b5563;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">&#9889;</div>
            <h1>Universal Excel Converter</h1>
            <p class="subtitle">DROP ANY FILE &mdash; GET EXCEL</p>
        </div>

        <div class="drop-zone" id="dropZone">
            <div class="drop-icon">&#128196;</div>
            <div class="drop-text">Drop your file here or click to browse</div>
            <div class="drop-hint">Supports EDI 834, FLX, CSV, TSV, pipe-delimited, fixed-width, Highmark, and more</div>
            <input type="file" class="file-input" id="fileInput">
        </div>

        <div class="formats">
            <span class="format-tag">EDI 834</span>
            <span class="format-tag">FLX</span>
            <span class="format-tag">CSV</span>
            <span class="format-tag">TSV</span>
            <span class="format-tag">PIPE</span>
            <span class="format-tag">FIXED-WIDTH</span>
            <span class="format-tag">GZIP</span>
            <span class="format-tag highmark">HIGHMARK STD</span>
            <span class="format-tag highmark">HIGHMARK CDE</span>
        </div>

        <div class="status hidden" id="status">
            <div class="spinner"></div>
            <div class="status-text">Converting...</div>
        </div>

        <div class="result hidden" id="result"></div>

        <div class="footer">Quantify Specialty Care &mdash; Data Team</div>
    </div>

    <script>
    // ─── LIBRARY CHECK ────────────────────────────────────────────────
    window.addEventListener('load', () => {
        const result = document.getElementById('result');
        if (typeof XLSX === 'undefined' || typeof pako === 'undefined') {
            result.innerHTML = '<div class="result-header"><span class="result-icon">&#9888;</span><span class="result-title" style="color:#f59e0b">Libraries loading...</span></div>' +
                '<p class="error-text">XLSX: ' + (typeof XLSX !== 'undefined' ? 'OK' : 'MISSING') +
                ' | pako: ' + (typeof pako !== 'undefined' ? 'OK' : 'MISSING') +
                '<br>Try refreshing the page.</p>';
            result.classList.remove('hidden');
            result.classList.add('error');
        }
    });

    // ─── UTILITY: DATE FORMATTER (CCYYMMDD → MM/DD/YYYY) ─────────────
    function formatCcyymmdd(s) {
        if (!s) return '';
        s = s.trim();
        // Skip obviously invalid dates like 00010101
        if (s === '00010101' || s === '00000000') return '';
        if (s.length === 8 && /^\d{8}$/.test(s)) {
            const yr = s.slice(0, 4);
            const mo = s.slice(4, 6);
            const dy = s.slice(6, 8);
            if (yr === '0001' || yr === '0000') return '';
            return mo + '/' + dy + '/' + yr;
        }
        return s;
    }

    // ─── UTILITY: EDI DATE FORMATTER ─────────────────────────────────
    function formatEdiDate(s) {
        if (!s) return '';
        s = s.replace('D8', '').trim();
        if (s.length === 8 && /^\d+$/.test(s)) {
            return s.slice(4, 6) + '/' + s.slice(6, 8) + '/' + s.slice(0, 4);
        }
        return s;
    }

    // ─── UTILITY: PARSE AMOUNT STRING (with decimal point) ───────────
    function parseAmountDecimal(s) {
        if (!s || !s.trim()) return '';
        const trimmed = s.trim();
        const n = parseFloat(trimmed);
        if (isNaN(n)) return trimmed;
        return n;
    }

    // ─── FORMAT DETECTION ─────────────────────────────────────────────
    function detectFormat(text, filename) {
        const fname = filename.toLowerCase();

        // 1. Excel passthrough
        if (fname.endsWith('.xlsx') || fname.endsWith('.xls')) return 'excel';

        // 2. CSV/TSV by extension
        if (fname.endsWith('.csv')) return 'csv';
        if (fname.endsWith('.tsv')) return 'tsv';

        const firstLine = text.split('\n')[0];
        const lines = text.trim().split('\n');

        // 3. EDI 834
        if (text.trim().startsWith('ISA') && text.slice(0, 500).includes('~')) return 'edi_834';

        // 4. Highmark STD_PD — pipe-delimited with specific header signature
        if (firstLine.includes('EMPLOYEE_IDENTIFICATION|') &&
            firstLine.includes('EMPLOYEE_AGREEMENT_NUMBER')) return 'highmark_std';

        // 5. FLX — filename contains 'flx'
        if (fname.includes('flx')) return 'flx';

        // 6. Highmark CDE Legacy — fixed-width, line length 2400-2502, no pipe delimiter
        if (lines.length > 1) {
            const sampleLines = lines.slice(0, Math.min(5, lines.length)).filter(l => l.length > 100);
            if (sampleLines.length > 0) {
                const lens = sampleLines.map(l => l.replace(/\r/g, '').length);
                const avgLen = lens.reduce((a, b) => a + b, 0) / lens.length;
                const pipeCount = sampleLines[0].split('|').length - 1;
                if (avgLen >= 2400 && avgLen <= 2502 && pipeCount < 3) {
                    // Verify first 17 chars look like an alphanumeric employee ID
                    const first17 = sampleLines[0].substring(0, 17).trim();
                    if (/^[A-Z0-9]+/.test(first17)) return 'highmark_cde';
                }
            }
        }

        // 7. Generic delimited / fixed-width fallbacks
        if (lines.length > 1) {
            const pipeCounts = lines.slice(0, 10).map(l => (l.match(/\|/g) || []).length);
            if (pipeCounts.every(c => c > 2)) return 'pipe';
        }

        if (lines.length > 1) {
            const tabCounts = lines.slice(0, 10).map(l => (l.match(/\t/g) || []).length);
            if (tabCounts.every(c => c > 0)) return 'tab';
        }

        if (lines.length > 5) {
            const lengths = lines.slice(0, 20).map(l => l.length);
            const uniqueLengths = new Set(lengths);
            if (uniqueLengths.size <= 2 && lengths[0] > 100) {
                const sample = lines.slice(0, 5).join('\n');
                const pipeC = (sample.match(/\|/g) || []).length;
                const commaC = (sample.match(/,/g) || []).length;
                const tabC = (sample.match(/\t/g) || []).length;
                if (Math.max(pipeC, commaC, tabC) < lines.slice(0, 5).length * 2) return 'fixed_width';
            }
        }

        if (lines.length > 1) {
            const commaCounts = lines.slice(0, 10).map(l => (l.match(/,/g) || []).length);
            if (commaCounts.every(c => c > 0)) return 'csv';
        }

        return 'unknown';
    }

    // ─── EDI 834 PARSER ──────────────────────────────────────────────
    function parseEdi834(text) {
        const segments = text.split('~').map(s => s.trim()).filter(Boolean);
        const records = [];
        let current = {};
        let inMember = false;

        for (const seg of segments) {
            const el = seg.split('*');
            const id = el[0].trim();

            if (id === 'INS') {
                if (inMember && Object.keys(current).length) records.push({...current});
                current = {};
                inMember = true;
                current.Subscriber_Indicator = el[1] || '';
                current.Relationship_Code = el[2] || '';
                current.Maintenance_Type = el[3] || '';
                current.Maintenance_Reason = el[4] || '';
                current.Benefit_Status = el[5] || '';
                if (el.length > 8) current.Employment_Status = el[8] || '';
            } else if (id === 'REF') {
                const q = el[1] || '', v = el[2] || '';
                if (q === '0F') current.Subscriber_ID = v;
                else if (q === '1L') current.Group_Number = v;
                else if (q === '23') current.Client_Number = v;
                else if (q === 'ZZ') current.Mutually_Defined_ID = v;
                else current['REF_' + q] = v;
            } else if (id === 'DTP') {
                const q = el[1] || '', d = formatEdiDate(el[3] || '');
                const map = {'336':'Employment_Date','348':'Benefit_Begin_Date','349':'Benefit_End_Date',
                             '303':'Eligibility_Begin_Date','304':'Eligibility_End_Date',
                             '473':'Coverage_Begin_Date','474':'Coverage_End_Date'};
                current[map[q] || 'Date_' + q] = d;
            } else if (id === 'NM1') {
                const ec = el[1] || '';
                if (ec === 'IL') {
                    current.Last_Name = el[3] || '';
                    current.First_Name = el[4] || '';
                    current.Middle_Name = el[5] || '';
                    if (el.length > 7) current.Name_Suffix = el[7] || '';
                    if (el.length > 9) current.SSN_or_ID = el[9] || '';
                } else if (ec === 'P5') current.Sponsor_Name = el[3] || '';
                else if (ec === 'IN') current.Payer_Name = el[3] || '';
            } else if (id === 'PER') {
                if ((el[1] || '') === 'IP') {
                    for (let i = 3; i < el.length - 1; i += 2) {
                        const qual = el[i], val = el[i + 1] || '';
                        if (qual === 'HP') current.Home_Phone = val;
                        else if (qual === 'WP') current.Work_Phone = val;
                        else if (qual === 'TE') current.Phone = val;
                        else if (qual === 'EM') current.Email = val;
                    }
                }
            } else if (id === 'N3') {
                current.Address_Line1 = el[1] || '';
                current.Address_Line2 = el[2] || '';
            } else if (id === 'N4') {
                current.City = el[1] || '';
                current.State = el[2] || '';
                current.Zip = el[3] || '';
                current.Country = el[4] || '';
            } else if (id === 'DMG') {
                current.DOB = formatEdiDate(el[2] || '');
                current.Gender = el[3] || '';
            } else if (id === 'HD') {
                current.Insurance_Line = el[3] || '';
                current.Plan_Coverage = el[4] || '';
                current.Coverage_Level = el[5] || '';
            } else if (id === 'ICM') {
                current.Frequency = el[1] || '';
                current.Wage_Amount = el[2] || '';
            }
        }
        if (inMember && Object.keys(current).length) records.push({...current});
        if (!records.length) throw new Error('No member records found in EDI 834 file');
        return records;
    }

    // ─── FLX PARSER ──────────────────────────────────────────────────
    const FLX_LAYOUT = [
        ['Record_Type',0,1],['Claim_Type',1,2],['Subscriber_SSN',2,11],
        ['Member_ID',11,13],['Patient_Last_Name',13,28],['Patient_First_Name',28,40],
        ['Patient_MI',40,41],['Patient_DOB',41,49],['Patient_Sex',49,50],
        ['Patient_Relationship',50,52],['Subscriber_Last_Name',52,67],
        ['Subscriber_First_Name',67,79],['Patient_Address1',79,109],
        ['Patient_Address2',109,139],['Patient_City',139,159],
        ['Patient_State',159,161],['Patient_Zip',161,170],
        ['Group_Number',170,178],['Group_Name',178,208],
        ['Subgroup_Number',208,216],['Coverage_Type',216,217],
        ['Claim_Number',217,230],['Claim_Line',230,232],
        ['Date_of_Service_From',232,240],['Date_of_Service_To',240,248],
        ['Admission_Date',248,256],['Discharge_Date',256,264],
        ['Provider_NPI',264,274],['Provider_Tax_ID',274,283],
        ['Provider_Last_Name',283,313],['Provider_First_Name',313,328],
        ['Provider_Address1',328,358],['Provider_City',358,378],
        ['Provider_State',378,380],['Provider_Zip',380,389],
        ['Place_of_Service',389,391],['Type_of_Bill',391,395],
        ['Procedure_Code',395,403],['Procedure_Modifier1',403,405],
        ['Procedure_Modifier2',405,407],['Revenue_Code',407,411],
        ['Diagnosis_Code1',411,419],['Diagnosis_Code2',419,427],
        ['Diagnosis_Code3',427,435],['Diagnosis_Code4',435,443],
        ['DRG_Code',443,446],['Units',446,453],
        ['Billed_Amount',453,464],['Allowed_Amount',464,475],
        ['Paid_Amount',475,486],['Copay_Amount',486,497],
        ['Coinsurance_Amount',497,508],['Deductible_Amount',508,519],
        ['COB_Amount',519,530],['Net_Total',530,541],
        ['Check_Date',541,549],['Check_Number',549,564],
        ['Claim_Status',564,565],['Run_Date',565,573],
        ['Batch_Number',573,581],['Claim_Reference',600,630]
    ];

    const FLX_DATE_COLS = ['Patient_DOB','Date_of_Service_From','Date_of_Service_To',
                           'Admission_Date','Discharge_Date','Check_Date','Run_Date'];
    const FLX_AMT_COLS = ['Billed_Amount','Allowed_Amount','Paid_Amount','Copay_Amount',
                          'Coinsurance_Amount','Deductible_Amount','COB_Amount','Net_Total'];

    function parseFlx(text) {
        const lines = text.trim().split('\n').filter(l => l.trim().length > 50);
        const records = [];
        for (const line of lines) {
            const rec = {};
            for (const [name, start, end] of FLX_LAYOUT) {
                rec[name] = (line.substring(start, end) || '').trim();
            }
            for (const dc of FLX_DATE_COLS) {
                if (rec[dc]) rec[dc] = formatEdiDate(rec[dc]);
            }
            for (const ac of FLX_AMT_COLS) {
                if (rec[ac]) {
                    const num = parseFloat(rec[ac]) / 100;
                    rec[ac] = isNaN(num) ? rec[ac] : num;
                }
            }
            if (rec.Units) {
                const u = parseFloat(rec.Units) / 100;
                rec.Units = isNaN(u) ? rec.Units : u;
            }
            records.push(rec);
        }
        if (!records.length) throw new Error('No records found in FLX file');
        return records;
    }

    // ─── HIGHMARK STD_PD PARSER ───────────────────────────────────────
    const STD_DATE_COLS = new Set([
        'EMPLOYEE_DATE_OF_BIRTH', 'PATIENT_DATE_OF_BIRTH', 'DATE_CLAIM_RECEIVED',
        'INCURRED_DATE', 'DISCHARGE_DATE', 'FINALIZATION_DATE', 'WAREHOUSE_LOAD_DATE',
        'DATE_PRESCRIPTION_WRITTEN', 'CLAIM_LINE_SERVICE_END_DATE'
    ]);

    const STD_AMT_COLS = new Set([
        'PROVIDER_ALLOW_CHARGE', 'DEDUCTIBLE_AMOUNT', 'COINSURANCE_AMOUNT', 'COPAY_AMOUNT',
        'AMOUNT_EXCEEDING_MAXIUM', 'EMPLOYEE_PENALTY', 'OTHER_EMPLOYEE_LIABILITY',
        'OTHER_COB_AMOUNT', 'SALES_TAX', 'SERVICE_ADDITIONAL_PAYMENT_OR_SURCHARGE_AMOUNT',
        'PROVIDER_APPROVED_TO_PAY_AMOUNT', 'PER_CLAIM_ADMINISTRATION_/_ACCESS_FEE',
        'DRUG_DISPENSING_FEE_AMOUNT', 'INGREDIENT_COST_PAID', 'AVERAGE_WHOLESALE_UNIT_PRICE'
    ]);

    function parseHighmarkStd(text) {
        // Normalize line endings
        const rawLines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim().split('\n');
        if (rawLines.length < 2) throw new Error('Highmark STD file has fewer than 2 lines');

        const headerLine = rawLines[0];
        const allHeaders = headerLine.split('|');

        // Find non-FILLER column indices
        const keepIndices = [];
        const keepHeaders = [];
        for (let i = 0; i < allHeaders.length; i++) {
            if (allHeaders[i].trim() !== 'FILLER') {
                keepIndices.push(i);
                keepHeaders.push(allHeaders[i].trim());
            }
        }

        const records = [];
        for (let li = 1; li < rawLines.length; li++) {
            const line = rawLines[li];
            if (!line.trim()) continue;
            const vals = line.split('|');
            const rec = {};
            for (let k = 0; k < keepIndices.length; k++) {
                const colName = keepHeaders[k];
                let val = (vals[keepIndices[k]] || '').trim();

                if (STD_DATE_COLS.has(colName)) {
                    val = formatCcyymmdd(val);
                } else if (STD_AMT_COLS.has(colName)) {
                    val = parseAmountDecimal(val);
                }
                rec[colName] = val;
            }
            records.push(rec);
        }

        if (!records.length) throw new Error('No data records found in Highmark STD file');
        return records;
    }

    function buildHighmarkStdSummary(records) {
        const totalClaims = records.length;

        // Claim types by TYPE_OF_CLAIM_IDENTIFIER
        const claimTypes = {};
        const typeLabels = { 'P': 'Professional', 'O': 'Outpatient', 'I': 'Inpatient',
                             'DR': 'Drug/Rx', 'D': 'Dental' };
        records.forEach(r => {
            const t = r['TYPE_OF_CLAIM_IDENTIFIER'] || 'Unknown';
            claimTypes[t] = (claimTypes[t] || 0) + 1;
        });

        // Financial totals
        const amtTotals = {};
        for (const col of STD_AMT_COLS) {
            amtTotals[col] = 0;
        }
        records.forEach(r => {
            for (const col of STD_AMT_COLS) {
                const v = parseFloat(r[col]);
                if (!isNaN(v)) amtTotals[col] += v;
            }
        });

        const rows = [
            ['HIGHMARK STANDARD PAID CLAIMS — SUMMARY', ''],
            ['', ''],
            ['Total Claim Lines', totalClaims],
            ['', ''],
            ['CLAIM TYPES', '']
        ];
        for (const [type, count] of Object.entries(claimTypes)) {
            rows.push([(typeLabels[type] || type) + ' (' + type + ')', count]);
        }
        rows.push(['', '']);
        rows.push(['FINANCIAL TOTALS', '']);
        for (const col of STD_AMT_COLS) {
            if (amtTotals[col] !== 0) {
                rows.push([col.replace(/_/g, ' '), amtTotals[col].toFixed(2)]);
            }
        }
        return rows;
    }

    // ─── HIGHMARK CDE LEGACY PARSER ───────────────────────────────────
    // Field layout: [startPos (1-indexed), endPos (1-indexed), name]
    // Converted to 0-indexed for JS substring: start-1, end

    const CDE_DATE_COLS = new Set([
        'EMPLOYEE_DATE_OF_BIRTH', 'PATIENT_DATE_OF_BIRTH', 'DATE_CLAIM_RECEIVED',

        'PROVIDER_ALLOW_CHARGE', 'DEDUCTIBLE_AMOUNT', 'COINSURANCE_AMOUNT', 'COPAY_AMOUNT',
        'AMOUNT_EXCEEDING_MAXIMUM', 'EMPLOYEE_PENALTY', 'OTHER_EMPLOYEE_LIABILITY',

        'DRUG_DISPENSING_FEE', 'INGREDIENT_COST_PAID', 'AVERAGE_WHOLESALE_UNIT_PRICE'
    ]);

    function parseHighmarkCde(text) {
        // Normalize line endings (handle both CRLF and LF)
        const rawLines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');

        // Filter: skip empty lines and TRAILER records
        const dataLines = rawLines.filter(line => {
            if (!line.trim()) return false;
            if (line.toUpperCase().includes('TRAILER')) return false;
            // Must be at least 2400 chars to be a valid CDE record
            if (line.length < 2400) return false;
            return true;
        });

        if (!dataLines.length) throw new Error('No valid CDE Legacy records found (minimum 2400 chars per line required)');

        // First pass: extract all fields, track which columns have any non-empty value
        const allRecords = [];
        const colHasData = new Array(CDE_LAYOUT.length).fill(false);

        for (const line of dataLines) {
            const rec = {};
            for (let fi = 0; fi < CDE_LAYOUT.length; fi++) {
                const [startPos, endPos, colName] = CDE_LAYOUT[fi];
                // Convert 1-indexed to 0-indexed
                const s0 = startPos - 1;
                const e0 = endPos;
                let val = (line.substring(s0, e0) || '').trim();

                if (CDE_DATE_COLS.has(colName)) {
                    val = formatCcyymmdd(val);
                } else if (CDE_AMT_COLS.has(colName)) {
                    val = parseAmountDecimal(val);
                }

                rec[colName] = val;
                if (val !== '' && val !== 0) colHasData[fi] = true;
            }
            allRecords.push(rec);
        }

        // Second pass: remove columns that have no data across all records
        const keepCols = CDE_LAYOUT.filter((_, fi) => colHasData[fi]).map(([, , name]) => name);
        const keepSet = new Set(keepCols);

        const records = allRecords.map(rec => {
            const filtered = {};
            for (const col of keepCols) {
                if (keepSet.has(col)) filtered[col] = rec[col];
            }
            return filtered;
        });

        return records;
    }

    function buildCdeSummary(records) {
        const totalClaims = records.length;

        const claimTypes = {};
        const typeLabels = { 'P': 'Professional', 'O': 'Outpatient', 'I': 'Inpatient',
                             'DR': 'Drug/Rx', 'D': 'Dental', 'M': 'Medical' };
        records.forEach(r => {
            const t = (r['TYPE_OF_CLAIM_IDENTIFIER'] || 'Unknown').trim() || 'Unknown';
            claimTypes[t] = (claimTypes[t] || 0) + 1;
        });

        const amtTotals = {};
        for (const col of CDE_AMT_COLS) {
            amtTotals[col] = 0;
        }
        records.forEach(r => {
            for (const col of CDE_AMT_COLS) {
                if (r[col] !== undefined) {
                    const v = parseFloat(r[col]);
                    if (!isNaN(v)) amtTotals[col] += v;
                }
            }
        });

        const rows = [
            ['HIGHMARK CDE LEGACY — SUMMARY', ''],
            ['', ''],
            ['Total Claim Lines', totalClaims],
            ['', ''],
            ['CLAIM TYPES', '']
        ];
        for (const [type, count] of Object.entries(claimTypes)) {
            rows.push([(typeLabels[type] || type) + ' (' + type + ')', count]);
        }
        rows.push(['', '']);
        rows.push(['FINANCIAL TOTALS', '']);
        for (const col of CDE_AMT_COLS) {
            if (amtTotals[col] !== 0) {
                rows.push([col.replace(/_/g, ' '), amtTotals[col].toFixed(2)]);
            }
        }
        return rows;
    }

    // ─── DELIMITED PARSER ────────────────────────────────────────────
    function parseDelimited(text, delimiter) {
        const lines = text.trim().split('\n');
        if (lines.length < 2) throw new Error('File has fewer than 2 lines');

        function splitLine(line, delim) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (inQuotes && i + 1 < line.length && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (ch === delim && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += ch;
                }
            }
            result.push(current.trim());
            return result;
        }

        const headers = splitLine(lines[0], delimiter);
        const records = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const vals = splitLine(lines[i], delimiter);
            const rec = {};
            for (let j = 0; j < headers.length; j++) {
                rec[headers[j] || 'Col_' + (j + 1)] = vals[j] || '';
            }
            records.push(rec);
        }
        return records;
    }

    // ─── FIXED-WIDTH PARSER ──────────────────────────────────────────
    function parseFixedWidth(text) {
        const lines = text.trim().split('\n');
        if (lines.length < 2) throw new Error('File has fewer than 2 lines');

        const sampleLines = lines.slice(0, 100);
        const maxLen = Math.max(...sampleLines.map(l => l.length));

        const spacePositions = new Set(Array.from({length: maxLen}, (_, i) => i));
        for (const line of sampleLines) {
            const padded = line.padEnd(maxLen);
            for (let i = 0; i < padded.length; i++) {
                if (padded[i] !== ' ') spacePositions.delete(i);
            }
        }

        const sorted = [...spacePositions].sort((a, b) => a - b);
        const boundaries = [0];
        if (sorted.length) {
            for (let i = 1; i < sorted.length; i++) {
                if (sorted[i] !== sorted[i - 1] + 1) {
                    boundaries.push(sorted[i - 1] + 1);
                }
            }
            boundaries.push(sorted[sorted.length - 1] + 1);
        }

        if (boundaries.length < 2) {
            return lines.map(l => ({Data: l}));
        }

        const records = [];
        for (const line of lines) {
            const rec = {};
            for (let i = 0; i < boundaries.length; i++) {
                const start = boundaries[i];
                const end = i + 1 < boundaries.length ? boundaries[i + 1] : line.length;
                rec['Col_' + (i + 1)] = (line.substring(start, end) || '').trim();
            }
            records.push(rec);
        }

        const firstRow = records[0];
        const allText = Object.values(firstRow).every(v =>
            typeof v === 'string' && !/^\d+\.?\d*$/.test(v.replace('-', ''))
        );
        if (allText && records.length > 1) {
            const headers = Object.values(firstRow);
            const newRecords = [];
            for (let i = 1; i < records.length; i++) {
                const rec = {};
                const vals = Object.values(records[i]);
                for (let j = 0; j < headers.length; j++) {
                    rec[headers[j] || 'Col_' + (j + 1)] = vals[j] || '';
                }
                newRecords.push(rec);
            }
            return newRecords;
        }
        return records;
    }

    // ─── MAIN CONVERSION ─────────────────────────────────────────────
    function convertToExcel(records, filename, format, summaryData) {
        const ws = XLSX.utils.json_to_sheet(records);

        const cols = Object.keys(records[0] || {});
        ws['!cols'] = cols.map(c => {
            let maxW = c.length;
            for (let i = 0; i < Math.min(records.length, 100); i++) {
                const val = String(records[i][c] !== undefined ? records[i][c] : '');
                maxW = Math.max(maxW, val.length);
            }
            return {wch: Math.min(maxW + 2, 50)};
        });

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Data');

        // Build summary sheet depending on format
        let summaryRows = summaryData || null;

        if (!summaryRows && (format === 'edi_834' || format === 'flx')) {
            summaryRows = [
                ['File Summary', ''],
                ['', ''],
                ['Format', format.toUpperCase().replace('_', ' ')],
                ['Total Records', records.length],
                ['Total Columns', cols.length]
            ];

            if (format === 'edi_834') {
                const subs = records.filter(r => r.Subscriber_Indicator === 'Y').length;
                const deps = records.filter(r => r.Subscriber_Indicator === 'N').length;
                if (subs || deps) {
                    summaryRows.push(['Subscribers', subs]);
                    summaryRows.push(['Dependents', deps]);
                }
                const states = new Set(records.map(r => r.State).filter(Boolean));
                summaryRows.push(['Unique States', states.size]);
            }

            if (format === 'flx') {
                const types = {};
                const labels = {P:'Professional',O:'Outpatient',I:'Inpatient',VB:'Capitation'};
                records.forEach(r => {
                    const t = r.Claim_Type || 'Unknown';
                    types[t] = (types[t] || 0) + 1;
                });
                for (const [t, count] of Object.entries(types)) {
                    summaryRows.push([(labels[t] || t) + ' Claims (' + t + ')', count]);
                }
                for (const ac of FLX_AMT_COLS) {
                    const total = records.reduce((s, r) => s + (parseFloat(r[ac]) || 0), 0);
                    if (total) summaryRows.push(['Total ' + ac.replace(/_/g, ' '), '$' + total.toFixed(2)]);
                }
            }
        }

        if (summaryRows) {
            const summaryWs = XLSX.utils.aoa_to_sheet(summaryRows);
            summaryWs['!cols'] = [{wch: 50}, {wch: 25}];
            XLSX.utils.book_append_sheet(wb, summaryWs, 'Summary');
        }

        const outName = filename.replace(/\.(txt|csv|tsv|dat|edi|gz)$/i, '') + '.xlsx';
        XLSX.writeFile(wb, outName);
        return { filename: outName, rows: records.length, columns: cols.length, format };
    }

    // ─── STATUS HELPER ───────────────────────────────────────────────
    function setStatus(msg) {
        const el = document.querySelector('.status-text');
        if (el) el.textContent = msg;
    }

    // ─── FILE HANDLING ───────────────────────────────────────────────
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    async function handleFile(file) {
        statusEl.classList.remove('hidden');
        resultEl.classList.add('hidden');
        resultEl.classList.remove('error');
        setStatus('Reading file...');
        await new Promise(r => setTimeout(r, 50));

        try {
            let filename = file.name;

            // Read as ArrayBuffer first
            const buffer = await file.arrayBuffer();
            let bytes = new Uint8Array(buffer);

            // Handle gzip
            if (filename.toLowerCase().endsWith('.gz')) {
                setStatus('Decompressing gzip...');
                await new Promise(r => setTimeout(r, 10));
                bytes = pako.inflate(bytes);
                filename = filename.slice(0, -3);
            }

            // Handle Excel files directly
            if (filename.toLowerCase().endsWith('.xlsx') || filename.toLowerCase().endsWith('.xls')) {
                statusEl.classList.add('hidden');
                resultEl.innerHTML = `
                    <div class="result-header">
                        <span class="result-icon">&#8505;</span>
                        <span class="result-title" style="color:#60a5fa">Already Excel</span>
                    </div>
                    <p class="result-stats">This file is already in Excel format.</p>`;
                resultEl.classList.remove('hidden', 'error');
                fileInput.value = '';
                return;
            }

            // Decode text
            setStatus('Decoding text...');
            await new Promise(r => setTimeout(r, 10));
            const content = new TextDecoder('utf-8').decode(bytes);

            setStatus('Detecting format...');
            await new Promise(r => setTimeout(r, 10));
            const fmt = detectFormat(content, filename);

            let records;
            let summaryData = null;

            if (fmt === 'edi_834') {
                setStatus('Parsing EDI 834...');
                await new Promise(r => setTimeout(r, 10));
                records = parseEdi834(content);

            } else if (fmt === 'flx') {
                setStatus('Parsing FLX fixed-width...');
                await new Promise(r => setTimeout(r, 10));
                records = parseFlx(content);

            } else if (fmt === 'highmark_std') {
                setStatus('Parsing Highmark Standard Paid Claims...');
                await new Promise(r => setTimeout(r, 10));
                records = parseHighmarkStd(content);
                setStatus('Building summary...');
                await new Promise(r => setTimeout(r, 10));
                summaryData = buildHighmarkStdSummary(records);

            } else if (fmt === 'highmark_cde') {
                setStatus('Parsing Highmark CDE Legacy (fixed-width 2500)...');
                await new Promise(r => setTimeout(r, 10));
                records = parseHighmarkCde(content);
                setStatus('Building summary...');
                await new Promise(r => setTimeout(r, 10));
                summaryData = buildCdeSummary(records);

            } else if (fmt === 'fixed_width') {
                setStatus('Parsing fixed-width...');
                await new Promise(r => setTimeout(r, 10));
                records = parseFixedWidth(content);

            } else if (fmt === 'pipe') {
                setStatus('Parsing pipe-delimited...');
                await new Promise(r => setTimeout(r, 10));
                records = parseDelimited(content, '|');

            } else if (fmt === 'tab') {
                setStatus('Parsing tab-delimited...');
                await new Promise(r => setTimeout(r, 10));
                records = parseDelimited(content, '\t');

            } else if (fmt === 'csv') {
                setStatus('Parsing CSV...');
                await new Promise(r => setTimeout(r, 10));
                records = parseDelimited(content, ',');

            } else {
                // Try each delimiter as fallback
                for (const d of [',', '\t', '|']) {
                    try {
                        records = parseDelimited(content, d);
                        if (Object.keys(records[0] || {}).length > 1) break;
                    } catch (e) { continue; }
                }
                if (!records || !records.length) {
                    throw new Error('Could not detect file format for: ' + filename +
                        '\nTried CSV, TSV, pipe-delimited, and fixed-width parsers.');
                }
            }

            setStatus('Building Excel workbook (' + records.length.toLocaleString() + ' rows)...');
            await new Promise(r => setTimeout(r, 10));
            const stats = convertToExcel(records, filename, fmt, summaryData);

            statusEl.classList.add('hidden');
            const fmtLabel = fmt.replace('highmark_std', 'HIGHMARK STD')
                               .replace('highmark_cde', 'HIGHMARK CDE')
                               .replace('edi_834', 'EDI 834')
                               .replace('fixed_width', 'FIXED WIDTH')
                               .toUpperCase().replace(/_/g, ' ');
            resultEl.innerHTML = `
                <div class="result-header">
                    <span class="result-icon">&#9989;</span>
                    <span class="result-title">Conversion Complete</span>
                </div>
                <div class="result-stats">
                    Format detected: <span>${fmtLabel}</span><br>
                    Rows: <span>${stats.rows.toLocaleString()}</span><br>
                    Columns: <span>${stats.columns}</span>${summaryData ? '<br>Sheets: <span>Data + Summary</span>' : ''}
                </div>
                <div style="margin-top:12px;font-size:12px;color:#6b7280">
                    &#128190; File downloaded automatically
                </div>`;
            resultEl.classList.remove('hidden', 'error');

        } catch (err) {
            statusEl.classList.add('hidden');
            const stackLines = err.stack ? err.stack.split('\n').slice(0, 4).join('<br>') : '';
            resultEl.innerHTML = `
                <div class="result-header">
                    <span class="result-icon">&#10060;</span>
                    <span class="result-title">Conversion Failed</span>
                </div>
                <p class="error-text">${err.message}</p>
                ${stackLines ? '<small style="color:#6b7280;margin-top:8px;display:block;font-size:11px;line-height:1.5">' + stackLines + '</small>' : ''}`;
            resultEl.classList.remove('hidden');
            resultEl.classList.add('error');
        }

        fileInput.value = '';
    }
